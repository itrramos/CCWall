<!DOCTYPE html>
<html>
<head>
<title>Announcements</title>
<style>
  body {
    background-color: #555759;
    color: #CCCCCC;
    text-align: center;
    font-family: Calibri, sans-serif; /* Default font for the body */
  }
  .container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
  }
  .frame {
    background-color: #9a9a9e;
    border: 2px solid #B6BD00;
    padding: 20px;
    margin: 10px;
    width: calc(50% - 40px); /* Adjusting width to fit two frames per row */
    box-sizing: border-box;
    text-align: center;
    color: #000000; /* Default color for text inside the frame */
    font-family: Calibri; /* Default font for text inside the frame */
  }
  .frame h1 {
    font-size: 3.3em;
    color: #ffffff; /* Color for h1 text */
    font-family: 'Calibri'; /* Font for h1 text */
  }
  .frame p {
    font-size: 2.6em;
    color: #000000; /* Color for p text */
    font-family: 'Calibri'; /* Font for p text */
  }
  .frame img {
    width: 100px;
    height: auto;
    margin-right: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="frame">
    <h1><strong>  "High Street TV reviews for July: 20" </strong></h1>
    <p><strong>   "nutribullet reviews for July: 19" </strong></p>
	</div>
  <div class="frame">
    <h1><strong> "Reviews & Turnarounds each team" </strong></h1>
    <p><strong> "Customer Service 5, Sales 7" </strong></p>
  </div>
  <div class="frame">
    <h1><strong>"Top Advisor Reviews:"</strong></h1>
	<p><strong> "Nimmy with 4" </strong></p>
  </div>
  <div class="frame">
   <h1><strong>"Top Advisor Turnarounds" </strong></h1>
    <p><strong> "Janine with 3"</strong></p>
</div>

</body>
</html>
